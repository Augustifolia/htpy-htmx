name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pytest (3.10)
            python: "3.10"
          - name: pytest (3.11)
            python: "3.11"
          - name: pytest (3.12)
            python: "3.12"
          - name: pytest (3.13)
            python: "3.13"
          - name: pytest (3.14)
            python: "3.14"
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - run: uv sync
      - run: uv run --python ${{ matrix.python }} pytest
