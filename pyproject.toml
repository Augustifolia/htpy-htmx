[project]
name = "htpy-htmx"
version = "0.1.0"
authors = [ { name = "August Malmdahl" } ]
description = "Helpers for using htmx in htpy"
requires-python = ">=3.10"
dependencies = [
    "htpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]


[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
strict = true
